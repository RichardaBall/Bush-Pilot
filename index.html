<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Bush Plane Explorer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #e7efe8;
      background: rgba(12, 18, 16, 0.62);
      border: 1px solid rgba(232, 236, 230, 0.14);
      backdrop-filter: blur(10px);
      padding: 14px 18px;
      border-radius: 12px;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }
    #prompt-overlay {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(640px, 86vw);
      text-align: center;
      color: #f4f1ea;
      background: rgba(12, 18, 16, 0.72);
      border: 1px solid rgba(232, 236, 230, 0.14);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
      pointer-events: none;
    }
    #prompt-overlay:empty { display: none; }
    #build-menu {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: max-content;
      min-width: 220px;
      text-align: left;
      color: #e7efe8;
      background: rgba(12, 18, 16, 0.78);
      border: 1px solid rgba(232, 236, 230, 0.14);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      pointer-events: none;
      white-space: pre;
      line-height: 1.55;
    }
    #build-menu:empty { display: none; }
    #inventory {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    #inventory:empty { display: none; }
    .bag-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 560px; }
    .slot, .act {
      background: rgba(12, 18, 16, 0.78);
      border: 1px solid rgba(232, 236, 230, 0.16);
      color: #e7efe8;
      backdrop-filter: blur(10px);
    }
    .slot {
      width: 72px;
      height: 78px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
    }
    .slot svg { width: 34px; height: 34px; }
    .slot span, .act { font-size: 11px; letter-spacing: 0.01em; }
    .slot b {
      position: absolute;
      top: 5px;
      right: 7px;
      font-size: 12px;
      font-weight: 600;
    }
    .act {
      padding: 7px 12px;
      border-radius: 999px;
    }
    .slot.on, .act.on { border-color: #f4f1ea; }
    #meters {
      position: absolute;
      left: 20px;
      bottom: 24px;
      color: #e7efe8;
      background: rgba(12, 18, 16, 0.62);
      border: 1px solid rgba(232, 236, 230, 0.14);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 12px;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.55;
      min-width: 180px;
    }
    #meters:empty { display: none; }
    #meters b { font-weight: 600; color: #f3f6f2; }
  </style>

  <!-- Import maps polyfill -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  
  <div id="ui-overlay">
    <div><strong>Controls:</strong></div>
    <div id="controls-info">On-Foot: WASD or Arrow Keys to move. [E] Enter Aircraft when near.</div>
    <div id="state-info">State: On-Foot</div>
  </div>

  <div id="inventory"></div>
  <div id="meters"></div>
  <div id="prompt-overlay"></div>
  <div id="build-menu"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
